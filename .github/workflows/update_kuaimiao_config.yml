name: Update Kuaimiao Proxy Config

on:
  workflow_dispatch: # 允許手動觸發
  schedule:
    # 每天 UTC 時間 00:00 (北京時間早上 8 點) 運行
    # 你可以修改 '0 0 * * *' 來調整運行時間
    - cron: '0 0 * * *' 

jobs:
  update-config:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script to get and save config
      env:
        # 設定 CONFIG_FILE_PATH 環境變數，讓 Python 腳本知道儲存路徑
        CONFIG_FILE_PATH: proxies/kuaimiao_config.yaml
      run: |
        python get_kuaimiao_config.py

    - name: Commit and push changes
      run: |
        # 確保 Git identity 已設定
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Add the changes
        git add ${{ env.CONFIG_FILE_PATH }}
        
        # Check if there are any changes staged
        if ! git diff --staged --quiet; then
          # Commit and push only if there are changes
          git commit -m "chore(kuaimiao): update proxy config"
          git push
        else
          echo "No changes to commit."
        fi
      # GITHUB_TOKEN is automatically provided by GitHub Actions for write permissions